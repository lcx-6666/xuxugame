<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>嘘嘘记忆翻牌</title>
<style>
:root{
  --bg:#e9f6fc; --ink:#2c4a5a; --accent:#36b3e3; --accent-dark:#238ab3;
  --bubble:#cdeaf7; --radius:14px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  background:linear-gradient(180deg,#d8f0fb 0%,var(--bg) 40%,#f4fbff 100%);
  min-height:100vh;color:var(--ink);
}
.wrap{max-width:480px;margin:0 auto;padding:16px 14px 40px}
header{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.back{
  width:38px;height:38px;border:none;border-radius:50%;background:#fff;color:var(--accent-dark);
  font-size:18px;cursor:pointer;box-shadow:0 2px 8px rgba(44,116,150,.15);flex-shrink:0;
}
h1{font-size:22px;font-weight:800;letter-spacing:1px}
h1 span{color:var(--accent-dark)}
.toolbar{display:flex;gap:10px;margin-bottom:14px}
.stat{
  flex:1;background:#fff;border-radius:var(--radius);padding:8px 10px;
  box-shadow:0 2px 10px rgba(44,116,150,.1);text-align:center;
}
.stat .label{font-size:11px;color:#7ba3b5}
.stat .val{font-size:20px;font-weight:800;color:var(--accent-dark)}
button.btn{
  border:none;border-radius:var(--radius);background:var(--accent);color:#fff;
  font-size:14px;font-weight:700;padding:9px 16px;cursor:pointer;
  box-shadow:0 3px 10px rgba(54,179,227,.35);
}
button.btn:active{background:var(--accent-dark)}
#board{
  display:grid;grid-template-columns:repeat(4,1fr);gap:10px;
  perspective:1000px;
}
.card{
  aspect-ratio:3/4;cursor:pointer;position:relative;
  transform-style:preserve-3d;transition:transform .35s;
}
.card.flip{transform:rotateY(180deg)}
.card .face{
  position:absolute;inset:0;border-radius:12px;
  display:flex;align-items:center;justify-content:center;
  backface-visibility:hidden;-webkit-backface-visibility:hidden;
  box-shadow:0 3px 10px rgba(44,116,150,.18);
  font-size:clamp(26px,8vw,40px);
}
.card .front{
  background:linear-gradient(135deg,var(--accent),#7dd5f7);
  color:#fff;font-size:clamp(20px,6vw,30px);
}
.card .back{
  background:#fff;transform:rotateY(180deg);
}
.card.done .back{background:var(--bubble);box-shadow:inset 0 0 0 2px var(--k,var(--accent))}
/* 翻开后的牌面是嘘嘘圆脸（照片读不出来时退回表情，见 JS 兜底）
   8 张脸是同一个人，光看脸很难配对，所以外圈用 --k 上异色 + 右上角补原 emoji 角标，
   双重编码让"找相同"重新变成一眼可判 */
.card .back .pic{
  width:70%;aspect-ratio:1/1;border-radius:50%;object-fit:cover;object-position:center 22%;
  background:var(--bubble);box-shadow:0 0 0 3px #fff,0 0 0 6px var(--k,var(--accent));pointer-events:none;
}
.card .back .tag{
  position:absolute;top:5%;right:5%;
  width:32%;aspect-ratio:1/1;border-radius:50%;
  background:#fff;border:2px solid var(--k,var(--accent));
  display:flex;align-items:center;justify-content:center;
  font-size:clamp(11px,3.2vw,18px);line-height:1;
  box-shadow:0 1px 3px rgba(44,74,90,.3);pointer-events:none;
}
#overlay{
  position:fixed;inset:0;background:rgba(233,246,252,.94);
  display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:9;
}
#overlay.show{display:flex}
#overlay h2{font-size:28px;font-weight:900}
#overlay p{font-size:15px;color:#5b8296}
#hint{text-align:center;font-size:13px;color:#7ba3b5;margin-top:14px;line-height:1.7}
footer{margin-top:26px;text-align:center;font-size:12px;color:#9dbccb}
@media (min-width:600px){
  h1{font-size:26px}
  #board{gap:14px}
}
@media (min-width:1024px){
  .wrap{max-width:560px;padding-top:40px}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <button class="back" onclick="location.href='../../../index.html'" title="返回大厅">←</button>
    <h1>嘘嘘<span>记忆翻牌</span></h1>
  </header>
  <div class="toolbar">
    <div class="stat"><div class="label">步数</div><div class="val" id="moves">0</div></div>
    <div class="stat"><div class="label">配对</div><div class="val" id="pairs">0/8</div></div>
    <div class="stat"><div class="label">最佳</div><div class="val" id="best">--</div></div>
    <button class="btn" id="restart">重开</button>
  </div>
  <div id="board"></div>
  <div id="hint">点击卡片翻开，找出两张相同的嘘嘘脸。全部配对成功即胜利，步数越少越厉害！</div>
  <footer>嘘嘘游戏 · 合集</footer>
</div>
<div id="overlay">
  <h2>配对成功！🎉</h2>
  <p id="ovText"></p>
  <button class="btn" id="ovBtn">再来一局</button>
</div>
<script src="../../js/photos.js"></script>
<script>
(function(){
"use strict";
var EMOJIS=['💧','🫧','🌊','💦','🚿','🛁','🧼','🐳'];
var FACES=[0,1,2,3,4,5,6,7];  // 8 种牌面用 8 张不同的嘘嘘照片编号，同一对牌复用同一张
var KIND_COLORS=['#ef5350','#ffa726','#fdd835','#43a047','#1e88e5','#8e24aa','#00acc1','#6d4c41'];
var boardEl=document.getElementById('board');
var movesEl=document.getElementById('moves'), pairsEl=document.getElementById('pairs'), bestEl=document.getElementById('best');
var overlay=document.getElementById('overlay'), ovText=document.getElementById('ovText');

var first=null, lock=false, moves=0, pairs=0, matched=0;
var gen=0; // 局数代记号：胜利弹窗延迟 500ms，期间点了重开就不要再弹旧窗
var best=localStorage.getItem('xuxu_memory_best');
if(best)bestEl.textContent=best;

function init(){
  gen++;
  first=null; lock=false; moves=0; pairs=0; matched=0;
  movesEl.textContent=0; pairsEl.textContent='0/8';
  overlay.classList.remove('show');
  var faces=!!(window.XUXU&&XUXU.COUNT>=8);   // 照片工具没加载成功就用表情牌，游戏照常能玩
  var kinds=faces?FACES:EMOJIS;
  var deck=kinds.concat(kinds);
  for(var i=deck.length-1;i>0;i--){
    var j=Math.floor(Math.random()*(i+1));
    var t=deck[i];deck[i]=deck[j];deck[j]=t;
  }
  boardEl.innerHTML='';
  deck.forEach(function(e){
    var c=document.createElement('div');
    c.className='card';
    c.innerHTML='<div class="face front">🫧</div><div class="face back">'+(faces?'<img class="pic" alt="嘘嘘" src="'+XUXU.url(+e)+'"><span class="tag">'+EMOJIS[e]+'</span>':e)+'</div>';
    c.dataset.e=e;
    c.addEventListener('click',function(){flip(c);});
    if(faces){
      c.querySelector('.back').style.setProperty('--k',KIND_COLORS[e]);   // 每种牌一个异色外圈
      var pic=c.querySelector('img.pic');
      pic.onerror=function(){pic.parentNode.textContent=EMOJIS[e];};  // 某张照片挂了：这张牌退回表情，不留白块
    }
    boardEl.appendChild(c);
  });
}

function flip(c){
  if(lock||c.classList.contains('flip'))return;
  c.classList.add('flip');
  if(!first){ first=c; return; }
  moves++;
  movesEl.textContent=moves;
  if(first.dataset.e===c.dataset.e){
    first.classList.add('done');
    c.classList.add('done');
    first=null;
    matched++;
    pairsEl.textContent=matched+'/8';
    if(matched===8)win();
  }else{
    lock=true;
    var a=first; first=null;
    setTimeout(function(){
      a.classList.remove('flip');
      c.classList.remove('flip');
      lock=false;
    },750);
  }
}

function win(){
  var saved=+(localStorage.getItem('xuxu_memory_best')||999);
  if(moves<saved){
    localStorage.setItem('xuxu_memory_best',moves);
    bestEl.textContent=moves;
    ovText.textContent='用了 '+moves+' 步，刷新最佳纪录！';
  }else{
    ovText.textContent='用了 '+moves+' 步 · 最佳 '+saved+' 步';
  }
  var g=gen;
  setTimeout(function(){ if(g===gen) overlay.classList.add('show'); },500);
}

document.getElementById('restart').addEventListener('click',init);
document.getElementById('ovBtn').addEventListener('click',init);

init();
})();
</script>
</body>
</html>
