<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>嘘嘘 2048</title>
<style>
  :root{
    --bg:#e9f6fc;
    --board:#a8cce0;
    --cell:rgba(255,255,255,.45);
    --ink:#2c4a5a;
    --ink-soft:#5d7d8d;
    --accent:#36b3e3;
    --accent-dark:#238ab3;
    --bubble:#cdeaf7;
    --radius:14px;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    background:var(--bg);
    background-image:
      radial-gradient(circle at 14% 10%, rgba(54,179,227,.18), transparent 42%),
      radial-gradient(circle at 86% 88%, rgba(120,210,240,.18), transparent 45%),
      radial-gradient(circle at 72% 12%, rgba(180,230,250,.20), transparent 38%);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",-apple-system,sans-serif;
    color:var(--ink);
    min-height:100%;
    padding:18px 0 30px;
    user-select:none;-webkit-user-select:none;
    touch-action:manipulation;
  }
  .wrap{max-width:480px;margin:0 auto;padding:0 14px;}
  header{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;flex-wrap:wrap;}
  .logo{display:flex;align-items:center;gap:8px;}
  .logo .bubble{font-size:38px;line-height:1;filter:drop-shadow(0 2px 0 rgba(0,0,0,.08));animation:bob 2.4s ease-in-out infinite;}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-5px) rotate(3deg)}}
  h1{font-size:30px;letter-spacing:2px;font-weight:800;}
  h1 small{display:block;font-size:12px;font-weight:600;color:var(--ink-soft);letter-spacing:3px;margin-top:2px;}
  .scores{display:flex;gap:8px;}
  .scorebox{background:#fff;border:2px solid var(--bubble);border-radius:12px;padding:6px 14px;text-align:center;min-width:74px;box-shadow:0 2px 0 rgba(0,0,0,.05);}
  .scorebox .label{font-size:11px;color:var(--ink-soft);letter-spacing:2px;}
  .scorebox .value{font-size:20px;font-weight:800;line-height:1.2;color:var(--ink);}
  .scorebox .value.bump{animation:bump .18s ease;}
  @keyframes bump{50%{transform:scale(1.25);}}
  .toolbar{display:flex;gap:8px;margin:14px 0 12px;flex-wrap:wrap;}
  button.btn{
    flex:1;min-width:88px;border:none;border-radius:999px;padding:10px 12px;font-size:15px;font-weight:700;
    cursor:pointer;font-family:inherit;letter-spacing:1px;
    background:#fff;color:var(--ink);border:2px solid var(--bubble);box-shadow:0 3px 0 #b3dcee;
    transition:transform .08s ease, box-shadow .08s ease;
  }
  button.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #b3dcee;}
  button.btn.primary{background:var(--accent);border-color:var(--accent-dark);color:#fff;box-shadow:0 3px 0 #1f7aa0;}
  button.btn.primary:active{box-shadow:0 1px 0 #1f7aa0;}
  button.btn.warn{background:#ffe38f;border-color:#eec85e;box-shadow:0 3px 0 #dbb54d;}
  .tip{font-size:12px;color:var(--ink-soft);margin-bottom:12px;line-height:1.7;}
  .tip b{color:var(--accent-dark);}
  #boardWrap{position:relative;width:100%;}
  #board{
    position:relative;width:100%;aspect-ratio:1/1;background:var(--board);
    border-radius:calc(var(--radius) + 6px);
    box-shadow:0 6px 0 rgba(35,90,115,.12), inset 0 2px 6px rgba(255,255,255,.5);
    overflow:hidden;
  }
  .cell{position:absolute;background:var(--cell);border-radius:var(--radius);box-shadow:inset 0 2px 4px rgba(0,0,0,.05);}
  .tile{
    position:absolute;border-radius:var(--radius);
    display:flex;align-items:center;justify-content:center;
    transition:left .12s ease-in-out, top .12s ease-in-out;
    overflow:hidden;
    box-shadow:0 3px 0 rgba(0,0,0,.1);
  }
  .tile .face{position:absolute;inset:0;background-size:cover;background-position:center 25%;}
  .tile .num{
    position:absolute;left:50%;bottom:5%;transform:translateX(-50%);
    background:rgba(255,255,255,.85);backdrop-filter:blur(2px);
    border-radius:999px;padding:1px 9px;font-weight:800;color:var(--ink);
    box-shadow:0 1px 2px rgba(0,0,0,.15);white-space:nowrap;
  }
  .tile .plain{font-weight:800;}
  .tile .crown{position:absolute;top:2%;left:50%;transform:translateX(-50%);font-size:1.4em;filter:drop-shadow(0 1px 1px rgba(0,0,0,.3));}
  .tile.new{animation:appear .18s ease .06s forwards;}
  @keyframes appear{from{transform:scale(.3);opacity:0;}to{transform:scale(1);opacity:1;}}
  .tile.pop{animation:pop .2s ease forwards;}
  @keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.22)}100%{transform:scale(1)}}
  #overlay{
    position:absolute;inset:0;border-radius:calc(var(--radius) + 6px);
    background:rgba(233,246,252,.92);backdrop-filter:blur(3px);
    display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;
    text-align:center;z-index:5;
  }
  #overlay.show{display:flex;animation:fadein .3s ease;}
  @keyframes fadein{from{opacity:0}}
  #overlay .big{font-size:50px;}
  #overlay .msg{font-size:22px;font-weight:800;letter-spacing:2px;}
  #overlay .sub{font-size:13px;color:var(--ink-soft);}
  #overlay .row{display:flex;gap:10px;}
  #overlay button.btn{flex:none;padding:10px 22px;}
  footer{margin-top:16px;padding:0 14px;font-size:11px;color:var(--ink-soft);text-align:center;line-height:1.8;}
  footer a{color:var(--accent-dark);text-decoration:none;}

  /* 响应式：平板 / 小电脑 */
  @media (min-width: 600px) {
    body{padding:32px 0 40px;}
    .wrap{max-width:520px;padding:0 20px;}
    h1{font-size:36px;}
    h1 small{font-size:14px;letter-spacing:4px;}
    .logo .bubble{font-size:46px;}
    .scorebox{padding:8px 18px;min-width:90px;}
    .scorebox .label{font-size:12px;}
    .scorebox .value{font-size:24px;}
    button.btn{padding:12px 18px;font-size:16px;}
    .tip{font-size:13px;margin-bottom:16px;}
    #board{border-radius:calc(var(--radius) + 10px);}
    footer{font-size:12px;margin-top:22px;}
  }
  /* 响应式：大屏电脑 */
  @media (min-width: 1024px) {
    body{padding:48px 0 60px;}
    .wrap{max-width:600px;}
    h1{font-size:42px;}
    .logo .bubble{font-size:54px;}
    .scorebox{padding:10px 22px;min-width:100px;}
    .scorebox .value{font-size:28px;}
    button.btn{padding:14px 22px;font-size:17px;}
    .tip{font-size:14px;}
    footer{font-size:13px;}
  }
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="logo">
    <span class="bubble">🫧</span>
    <h1>嘘嘘 2048<small>合成终极嘘嘘</small></h1>
  </div>
  <div class="scores">
    <div class="scorebox"><div class="label">分数</div><div class="value" id="score">0</div></div>
    <div class="scorebox"><div class="label">最佳</div><div class="value" id="best">0</div></div>
  </div>
</header>

<div class="toolbar">
  <button class="btn primary" id="btnNew">🫧 新开局</button>
  <button class="btn warn" id="btnUndo">↩️ 悔棋</button>
  <button class="btn" id="btnBack">🏠 大厅</button>
</div>

<div class="tip" id="tip">方块会按数字出现嘘嘘主题表情；越高数字越稀有～</div>

<div id="boardWrap">
  <div id="board"></div>
  <div id="overlay">
    <div class="big" id="ovEmoji">🫧</div>
    <div class="msg" id="ovMsg"></div>
    <div class="sub" id="ovSub"></div>
    <div class="row">
      <button class="btn primary" id="ovBtn1"></button>
      <button class="btn" id="ovBtn2" style="display:none"></button>
    </div>
  </div>
</div>
</div>

<footer>
  方向键 / WASD / 滑动屏幕操作 · <a href="../../../index.html">🏠 返回嘘嘘游戏大厅</a><br>
  灵感来自 <a href="https://milkyfrog.com/games" target="_blank" rel="noopener">milkyfrog.com</a> 奶蛙游戏宇宙
</footer>

<script>
(function(){
"use strict";
var N=4;
var board=document.getElementById('board');
var overlay=document.getElementById('overlay');
var scoreEl=document.getElementById('score'), bestEl=document.getElementById('best');

/* ========== 后台配置：把照片/表情包 URL 按顺序写在这里 ==========
   顺序 = 方块等级：第 1 张给 2，第 2 张给 4 …… 第 11 张给 2048。
   再往上的数字（4096+）会自动沿用最后一张照片并加 👑。
   路径相对本页面（assets/games/2048/），所以要用 ../../photos/。
   ================================================================ */
var PHOTOS=[
  // 2
  "../../photos/01.jpg",
  // 4
  "../../photos/02.jpg",
  // 8
  "../../photos/03.jpg",
  // 16
  "../../photos/04.jpg",
  // 32
  "../../photos/05.jpg",
  // 64
  "../../photos/06.jpg",
  // 128
  "../../photos/07.jpg",
  // 256
  "../../photos/08.jpg",
  // 512
  "../../photos/09.jpg",
  // 1024
  "../../photos/10.jpg",
  // 2048
  "../../photos/11.jpg"
];
/* ============================================================== */

/* 照片预加载：某一张加载失败就让那一级退回 emoji，
   否则方块背景已被设成 transparent，会变成只剩数字的空块 */
var PHOTO_OK=[];
function refreshTiles(){
  tiles.forEach(function(t){renderTile(t);fontSize(t);});
}
PHOTOS.forEach(function(src,i){
  PHOTO_OK[i]=false;
  var im=new Image();
  im.onload=function(){PHOTO_OK[i]=true;refreshTiles();};
  im.onerror=function(){PHOTO_OK[i]=false;refreshTiles();};
  im.src=src;
});
/* 只把真正加载成功的照片交出去 */
function photoAt(idx){
  if(!PHOTOS.length) return null;
  var i=Math.min(idx,PHOTOS.length-1);
  return PHOTO_OK[i] ? PHOTOS[i] : null;
}

var tiles=[];
var nextId=1;
var score=0, best=0, won=false, over=false, keepPlaying=false;
var undoStack=[];
var animating=false;   // 合并动画 110ms 内锁输入，否则快速连打会把棋盘状态搞乱
var cellSize=0, gap=10, pad=10;

function layout(){
  var W=board.clientWidth;
  gap = W>420?12:8; pad=gap;
  cellSize=(W-pad*2-gap*(N-1))/N;
  board.querySelectorAll('.cell').forEach(function(c){c.remove();});
  for(var r=0;r<N;r++)for(var c=0;c<N;c++){
    var d=document.createElement('div');d.className='cell';
    d.style.width=d.style.height=cellSize+'px';
    d.style.left=pad+c*(cellSize+gap)+'px';
    d.style.top=pad+r*(cellSize+gap)+'px';
    board.appendChild(d);
  }
  tiles.forEach(place);
  tiles.forEach(function(t){fontSize(t);});
}
function place(t){
  t.el.style.width=t.el.style.height=cellSize+'px';
  t.el.style.left=pad+t.col*(cellSize+gap)+'px';
  t.el.style.top=pad+t.row*(cellSize+gap)+'px';
}
function fontSize(t){
  var num=t.el.querySelector('.num'), plain=t.el.querySelector('.plain'), crown=t.el.querySelector('.crown');
  if(plain){ plain.style.fontSize=(cellSize*(String(t.value).length>2?0.30:0.40))+'px'; }
  if(num){ num.style.fontSize=Math.max(10,cellSize*0.17)+'px'; }
  if(crown){ crown.style.fontSize=(cellSize*0.26)+'px'; }
}

function lvOf(v){return Math.round(Math.log2(v));}
function tileBg(v){
  var map={1:'#eee4da',2:'#ede0c8',3:'#f2b179',4:'#f59563',5:'#f67c5f',6:'#f65e3b',
    7:'#edcf72',8:'#edcc61',9:'#edc850',10:'#edc53f',11:'#edc22e'};
  var lv=lvOf(v);
  if(lv>=12) return '#3c3a32';
  return map[lv] || '#eee4da';
}
function textColor(v){ return lvOf(v)<=2 ? '#776e65' : '#f9f6f2'; }

/* 嘘嘘主题 emoji：数字 2/4/8/16/32/64/128/256/512/1024/2048 */
var EMOJIS=['💧','🫧','🌊','💦','🚿','🛁','🧼','🌀','🐳','🦈','👑'];

function renderTile(t){
  var lv=lvOf(t.value);
  var idx=lv-1;
  var photo=photoAt(idx);
  var crowned=!!photo && idx>=PHOTOS.length;
  var html='';
  if(photo){
    html+='<div class="face" style="background-image:url(\''+photo+'\')"></div>';
    if(crowned) html+='<div class="crown">👑</div>';
    html+='<span class="num">'+t.value+'</span>';
    t.el.style.background='transparent';
    t.el.style.border='3px solid '+ (lvOf(t.value)>=8?'#36b3e3':'#fff');
  }else{
    var emoji=EMOJIS[Math.min(idx,EMOJIS.length-1)]||'👑';
    html+='<span class="plain" style="color:'+textColor(t.value)+'">'+emoji+'<br><span style="font-size:.55em">'+t.value+'</span></span>';
    t.el.style.background=tileBg(t.value);
    t.el.style.border='none';
    if(lvOf(t.value)>=7) t.el.style.boxShadow='0 0 '+(cellSize*0.25)+'px rgba(54,179,227,.55)';
    else t.el.style.boxShadow='0 3px 0 rgba(0,0,0,.1)';
  }
  t.el.innerHTML=html;
  fontSize(t);
}

function grid(){
  var g=[];for(var r=0;r<N;r++){g.push([null,null,null,null]);}
  tiles.forEach(function(t){g[t.row][t.col]=t;});
  return g;
}
function emptyCells(){
  var g=grid(),out=[];
  for(var r=0;r<N;r++)for(var c=0;c<N;c++)if(!g[r][c])out.push([r,c]);
  return out;
}
function spawn(){
  var e=emptyCells();if(!e.length)return null;
  var p=e[Math.floor(Math.random()*e.length)];
  var t={id:nextId++,value:Math.random()<0.9?2:4,row:p[0],col:p[1],el:document.createElement('div')};
  t.el.className='tile new';
  board.appendChild(t.el);
  tiles.push(t);place(t);renderTile(t);
  setTimeout(function(){t.el.classList.remove('new');},240);
  return t;
}
function snapshot(){
  return JSON.stringify({tiles:tiles.map(function(t){return [t.value,t.row,t.col];}),score:score,won:won});
}
function undo(){
  if(!undoStack.length||animating)return;
  var s=JSON.parse(undoStack.pop());
  tiles.forEach(function(t){t.el.remove();});
  tiles=[];over=false;
  hideOverlay();
  s.tiles.forEach(function(a){
    var t={id:nextId++,value:a[0],row:a[1],col:a[2],el:document.createElement('div')};
    t.el.className='tile';board.appendChild(t.el);tiles.push(t);place(t);renderTile(t);
  });
  score=s.score;won=s.won;updateScore(false);save();
}
var VECTORS={up:[-1,0],down:[1,0],left:[0,-1],right:[0,1]};
function traversals(dir){
  var rows=[0,1,2,3],cols=[0,1,2,3];
  if(dir==='down')rows.reverse();
  if(dir==='right')cols.reverse();
  return {rows:rows,cols:cols};
}
function move(dir){
  if(over||overlayShown||animating)return;
  var v=VECTORS[dir],tr=traversals(dir),g=grid();
  var snap=snapshot();   // 必须在滑动改写 row/col 之前拍快照，悔棋才能回到本步之前
  var moved=false, gained=0;
  var mergedSurvivor=[], dying=[];
  tr.rows.forEach(function(r){
    tr.cols.forEach(function(c){
      var t=g[r][c];if(!t)return;
      var nr=r,nc=c;
      while(true){
        var rr=nr+v[0],cc=nc+v[1];
        if(rr<0||rr>=N||cc<0||cc>=N)break;
        if(!g[rr][cc]){nr=rr;nc=cc;continue;}
        if(g[rr][cc].value===t.value && !g[rr][cc].__merged){nr=rr;nc=cc;}
        break;
      }
      var target=(nr!==r||nc!==c)?g[nr][nc]:null;
      if(target){
        target.__merged=true;
        g[r][c]=null;
        t.row=nr;t.col=nc;
        mergedSurvivor.push({t:target,newVal:t.value*2});
        dying.push(t);
        gained+=t.value*2;
        moved=true;
      }else if(nr!==r||nc!==c){
        g[r][c]=null;g[nr][nc]=t;
        t.row=nr;t.col=nc;moved=true;
      }
    });
  });
  if(!moved)return;
  undoStack.push(snap); if(undoStack.length>30)undoStack.shift();
  animating=true;
  tiles.forEach(function(t){ if(t.__merged)delete t.__merged; });
  tiles.forEach(place);
  setTimeout(function(){
    mergedSurvivor.forEach(function(m){
      m.t.value=m.newVal;
      m.t.el.classList.add('pop');
      setTimeout(function(){m.t.el.classList.remove('pop');},240);
      renderTile(m.t);
    });
    dying.forEach(function(t){
      var i=tiles.indexOf(t);if(i>=0)tiles.splice(i,1);
      t.el.remove();
    });
    if(gained){score+=gained;updateScore(true);}
    spawn();
    if(!keepPlaying && tiles.some(function(t){return t.value>=2048;})){won=true;showOverlay('win');}
    else if(!movesAvailable()){over=true;showOverlay('over');}
    save();
    animating=false;
  },110);
}
function movesAvailable(){
  if(emptyCells().length)return true;
  var g=grid();
  for(var r=0;r<N;r++)for(var c=0;c<N;c++){
    var v=g[r][c].value;
    if(r+1<N&&g[r+1][c].value===v)return true;
    if(c+1<N&&g[r][c+1].value===v)return true;
  }
  return false;
}

function updateScore(bump){
  scoreEl.textContent=score;
  if(score>best){best=score;localStorage.setItem('xuxu2048_best',best);}
  bestEl.textContent=best;
  if(bump){scoreEl.classList.remove('bump');void scoreEl.offsetWidth;scoreEl.classList.add('bump');}
}
function save(){
  localStorage.setItem('xuxu2048_state',JSON.stringify({
    tiles:tiles.map(function(t){return [t.value,t.row,t.col];}),
    score:score,won:won,keepPlaying:keepPlaying,over:over
  }));
}
function load(){
  best=parseInt(localStorage.getItem('xuxu2048_best')||'0',10)||0;
  var s=localStorage.getItem('xuxu2048_state');
  if(!s)return false;
  try{
    var d=JSON.parse(s);
    if(!d.tiles||!d.tiles.length)return false;
    d.tiles.forEach(function(a){
      var t={id:nextId++,value:a[0],row:a[1],col:a[2],el:document.createElement('div')};
      t.el.className='tile';board.appendChild(t.el);tiles.push(t);
    });
    score=d.score||0;won=!!d.won;keepPlaying=!!d.keepPlaying;over=!!d.over;
    return true;
  }catch(e){return false;}
}
function newGame(){
  tiles.forEach(function(t){t.el.remove();});
  tiles=[];score=0;won=false;over=false;keepPlaying=false;undoStack=[];
  hideOverlay();
  spawn();spawn();
  updateScore(false);save();
}

var overlayShown=false;
function showOverlay(kind){
  overlayShown=true;
  var e=document.getElementById('ovEmoji'),m=document.getElementById('ovMsg'),s=document.getElementById('ovSub');
  var b1=document.getElementById('ovBtn1'),b2=document.getElementById('ovBtn2');
  if(kind==='win'){
    e.textContent='👑';m.textContent='嘘嘘之王！';
    s.textContent='你合出了 2048，获得终极嘘嘘皇冠！';
    b1.textContent='😆 继续挑战';b1.onclick=function(){keepPlaying=true;hideOverlay();save();};
    b2.style.display='';b2.textContent='🫧 再来一局';b2.onclick=newGame;
  }else{
    e.textContent='🚽';m.textContent='冲不动了！';
    s.textContent='本局得分 '+score+' · 没地儿挪啦，再来一局？';
    b1.textContent='🫧 再来一局';b1.onclick=newGame;
    b2.style.display='none';
  }
  overlay.classList.add('show');
}
function hideOverlay(){overlayShown=false;overlay.classList.remove('show');}

document.addEventListener('keydown',function(ev){
  var map={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',s:'down',a:'left',d:'right',W:'up',S:'down',A:'left',D:'right'};
  var dir=map[ev.key];
  if(dir){ev.preventDefault();move(dir);}
});
var tx=0,ty=0,tracking=false;
board.addEventListener('touchstart',function(ev){
  if(ev.touches.length!==1)return;
  tx=ev.touches[0].clientX;ty=ev.touches[0].clientY;tracking=true;
},{passive:true});
board.addEventListener('touchmove',function(ev){ev.preventDefault();},{passive:false});
board.addEventListener('touchend',function(ev){
  if(!tracking)return;tracking=false;
  var dx=ev.changedTouches[0].clientX-tx, dy=ev.changedTouches[0].clientY-ty;
  if(Math.max(Math.abs(dx),Math.abs(dy))<28)return;
  if(Math.abs(dx)>Math.abs(dy))move(dx>0?'right':'left');
  else move(dy>0?'down':'up');
});
document.getElementById('btnNew').onclick=function(){if(confirm('重新开一局？当前进度会清空'))newGame();};
document.getElementById('btnUndo').onclick=undo;
document.getElementById('btnBack').onclick=function(){location.href='../../../index.html';};
window.addEventListener('resize',layout);
