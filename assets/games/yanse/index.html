<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>嘘嘘颜色大挑战</title>
<style>
:root{
  --bg:#e9f6fc; --ink:#2c4a5a; --accent:#36b3e3; --accent-dark:#238ab3;
  --radius:14px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  background:linear-gradient(180deg,#d8f0fb 0%,var(--bg) 40%,#f4fbff 100%);
  min-height:100vh;color:var(--ink);
  user-select:none;-webkit-user-select:none;
}
.wrap{max-width:480px;margin:0 auto;padding:16px 14px 40px}
header{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.back{
  width:38px;height:38px;border:none;border-radius:50%;background:#fff;color:var(--accent-dark);
  font-size:18px;cursor:pointer;box-shadow:0 2px 8px rgba(44,116,150,.15);flex-shrink:0;
}
h1{font-size:22px;font-weight:800;letter-spacing:1px}
h1 span{color:var(--accent-dark)}
.toolbar{display:flex;gap:10px;margin-bottom:14px}
.stat{
  flex:1;background:#fff;border-radius:var(--radius);padding:8px 10px;
  box-shadow:0 2px 10px rgba(44,116,150,.1);text-align:center;
}
.stat .label{font-size:11px;color:#7ba3b5}
.stat .val{font-size:20px;font-weight:800;color:var(--accent-dark)}
button.btn{
  border:none;border-radius:var(--radius);background:var(--accent);color:#fff;
  font-size:14px;font-weight:700;padding:9px 16px;cursor:pointer;
  box-shadow:0 3px 10px rgba(54,179,227,.35);
}
button.btn:active{background:var(--accent-dark)}
#target{
  height:90px;border-radius:18px;margin-bottom:14px;
  box-shadow:0 6px 20px rgba(44,116,150,.22);
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:18px;font-weight:800;text-shadow:0 1px 6px rgba(0,0,0,.25);
  transition:background .2s;
}
#grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.opt{
  aspect-ratio:1/1;border:none;border-radius:16px;cursor:pointer;
  box-shadow:0 3px 10px rgba(44,116,150,.15);
  transition:transform .08s, opacity .2s;
}
.opt:active{transform:scale(.94)}
.opt.wrong{animation:shake .3s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
#overlay{
  position:fixed;inset:0;background:rgba(233,246,252,.95);
  display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:9;
}
#overlay.show{display:flex}
#overlay h2{font-size:28px;font-weight:900}
#overlay p{font-size:15px;color:#5b8296;text-align:center;line-height:1.7}
#hint{text-align:center;font-size:13px;color:#7ba3b5;margin-top:14px;line-height:1.7}
footer{margin-top:26px;text-align:center;font-size:12px;color:#9dbccb}
/* 嘘嘘头像只出现在标题位和反馈画面里，答题色块一律保持纯色，不影响色差判断 */
.avatar{
  width:38px;height:38px;margin-left:auto;border-radius:50%;flex-shrink:0;
  background:#cdeaf7;border:2px solid #fff;box-shadow:0 2px 8px rgba(44,116,150,.15);
}
#ov-face{
  width:96px;height:96px;border-radius:50%;background:#cdeaf7;
  box-shadow:0 0 0 4px #fff,0 6px 18px rgba(44,116,150,.25);
}
@media (min-width:600px){
  h1{font-size:26px}
  #grid{gap:14px}
}
@media (min-width:1024px){.wrap{max-width:560px;padding-top:40px}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <button class="back" onclick="location.href='../../../index.html'" title="返回大厅">←</button>
    <h1>嘘嘘<span>颜色大挑战</span></h1>
    <div class="avatar" id="avatar" title="嘘嘘"></div>
  </header>
  <div class="toolbar">
    <div class="stat"><div class="label">得分</div><div class="val" id="score">0</div></div>
    <div class="stat"><div class="label">最佳</div><div class="val" id="best">0</div></div>
    <div class="stat"><div class="label">时间</div><div class="val" id="time">15</div></div>
    <button class="btn" id="restart">重开</button>
  </div>
  <div id="target">找到颜色不同的那一块</div>
  <div id="grid"></div>
  <div id="hint">每块颜色几乎一样，只有一块略有不同，点它！每答对一次加时，颜色差距越来越小。</div>
  <footer>嘘嘘游戏 · 合集</footer>
</div>
<div id="overlay" class="show">
  <div id="ov-face"></div>
  <h2>嘘嘘颜色大挑战</h2>
  <p>考验色彩敏锐度！15 秒起始时间，答对加时，颜色差距越来越小，看你能撑到多少分。</p>
  <button class="btn" id="ovBtn">开始挑战</button>
</div>
<script src="../../js/photos.js"></script>
<script>
(function(){
"use strict";
var gridEl=document.getElementById('grid');
var targetEl=document.getElementById('target');
var scoreEl=document.getElementById('score'), bestEl=document.getElementById('best'), timeEl=document.getElementById('time');
var overlay=document.getElementById('overlay'), ovBtn=document.getElementById('ovBtn');
var avatar=document.getElementById('avatar'), ovFace=document.getElementById('ov-face');

/* 把嘘嘘的脸放到装饰位：编号超范围由 photos.js 自动回绕，XUXU 没加载就什么都不做 */
function showFace(el,i){
  if(el&&window.XUXU&&XUXU.COUNT)XUXU.setFace(el,i);
}
showFace(avatar,0);
showFace(ovFace,1);

var score=0, playing=false, timeLeft=15, timer=null;
var gen=0; // 局数代记号：结束弹窗延迟 500ms，期间点了重开就不要再弹旧窗
var best=+(localStorage.getItem('xuxu_color_best')||0);
bestEl.textContent=best;

// HSL 颜色工具
function hsl(h,s,l){return 'hsl('+h+','+s+'%,'+l+'%)';}

function round(){
  var h=Math.floor(Math.random()*360);
  var s=55+Math.random()*25;
  var l=48+Math.random()*14;
  // 难度：分越高 ΔL 越小
  var diff=Math.max(2.5, 14-score*0.55);
  var n= score<5?4: (score<12?6:9);   // 格子数量随分提升
  gridEl.style.gridTemplateColumns='repeat('+Math.sqrt(n)+',1fr)';
  var odd=Math.floor(Math.random()*n);
  gridEl.innerHTML='';
  for(var i=0;i<n;i++){
    (function(i){
      var b=document.createElement('button');
      b.className='opt';
      b.style.background=i===odd?hsl(h,s,l-diff):hsl(h,s,l);
      b.addEventListener('click',function(){
        if(!playing)return;
        if(i===odd){
          score++;
          scoreEl.textContent=score;
          showFace(avatar,score);   // 答对反馈：换一张脸，色块本身不动
          if(score>best){best=score;localStorage.setItem('xuxu_color_best',best);bestEl.textContent=best;}
          timeLeft=Math.min(timeLeft+1.6,20);
          round();
        }else{
          b.classList.add('wrong');
          showFace(avatar,10);      // 答错反馈：顶部头像换成另一张脸
          end();
        }
      });
      gridEl.appendChild(b);
    })(i);
  }
  // 目标条也显示同色系做提示
  targetEl.style.background=hsl(h,s,l+6);
}

function start(){
  gen++;
  score=0; timeLeft=15; playing=true;
  scoreEl.textContent=0; timeEl.textContent=15;
  showFace(avatar,0);
  overlay.classList.remove('show');
  round();
  clearInterval(timer);
  timer=setInterval(function(){
    timeLeft=Math.max(0,timeLeft-0.1);
    timeEl.textContent=Math.ceil(timeLeft);
    if(timeLeft<=0)end();
  },100);
}

function end(){
  playing=false;
  clearInterval(timer);
  var isNew=score>0&&score>=best;
  var g=gen;
  setTimeout(function(){
    if(g!==gen)return;
    overlay.querySelector('h2').textContent=isNew?'新纪录！🎉':'挑战结束';
    overlay.querySelector('p').textContent='得分 '+score+' · 最佳 '+best;
    showFace(ovFace,isNew?8:10);    // 结束画面的嘘嘘头像：破纪录和没破纪录换脸
    ovBtn.textContent='再来一局';
    overlay.classList.add('show');
  },500);
}

ovBtn.addEventListener('click',start);
document.getElementById('restart').addEventListener('click',start);

round();
})();
</script>
</body>
</html>
