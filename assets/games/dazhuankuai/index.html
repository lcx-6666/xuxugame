<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>嘘嘘打砖块</title>
<style>
:root{
  --bg:#e9f6fc; --ink:#2c4a5a; --accent:#36b3e3; --accent-dark:#238ab3;
  --bubble:#cdeaf7; --radius:14px; --board:#a8cce0;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  background:linear-gradient(180deg,#d8f0fb 0%,var(--bg) 40%,#f4fbff 100%);
  min-height:100vh;color:var(--ink);
}
.wrap{max-width:480px;margin:0 auto;padding:16px 14px 40px}
header{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.back{
  width:38px;height:38px;border:none;border-radius:50%;background:#fff;color:var(--accent-dark);
  font-size:18px;cursor:pointer;box-shadow:0 2px 8px rgba(44,116,150,.15);flex-shrink:0;
}
h1{font-size:22px;font-weight:800;letter-spacing:1px}
h1 span{color:var(--accent-dark)}
.toolbar{display:flex;gap:10px;margin-bottom:14px}
.stat{
  flex:1;background:#fff;border-radius:var(--radius);padding:8px 10px;
  box-shadow:0 2px 10px rgba(44,116,150,.1);text-align:center;
}
.stat .label{font-size:11px;color:#7ba3b5}
.stat .val{font-size:20px;font-weight:800;color:var(--accent-dark)}
button.btn{
  border:none;border-radius:var(--radius);background:var(--accent);color:#fff;
  font-size:14px;font-weight:700;padding:9px 16px;cursor:pointer;
  box-shadow:0 3px 10px rgba(54,179,227,.35);
}
button.btn:active{background:var(--accent-dark)}
#stage{
  position:relative;width:100%;
  background:var(--board);border-radius:18px;
  box-shadow:0 6px 20px rgba(44,116,150,.22);
  touch-action:none;
}
#cv{width:100%;display:block;border-radius:18px}
#overlay{
  position:absolute;inset:0;background:rgba(233,246,252,.94);border-radius:18px;
  display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;
}
#overlay.show{display:flex}
#overlay h2{font-size:26px;font-weight:900}
#overlay p{font-size:15px;color:#5b8296}
#hint{text-align:center;font-size:13px;color:#7ba3b5;margin-top:12px;line-height:1.7}
footer{margin-top:26px;text-align:center;font-size:12px;color:#9dbccb}
@media (min-width:600px){
  h1{font-size:26px}
}
@media (min-width:1024px){
  .wrap{max-width:560px;padding-top:40px}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <button class="back" onclick="location.href='../../../index.html'" title="返回大厅">←</button>
    <h1>嘘嘘<span>打砖块</span></h1>
  </header>
  <div class="toolbar">
    <div class="stat"><div class="label">得分</div><div class="val" id="score">0</div></div>
    <div class="stat"><div class="label">最佳</div><div class="val" id="best">0</div></div>
    <div class="stat"><div class="label">关卡</div><div class="val" id="level">1</div></div>
    <button class="btn" id="restart">重开</button>
  </div>
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="overlay" class="show">
      <h2 id="ovTitle">嘘嘘打砖块</h2>
      <p id="ovText">左右滑动或移动鼠标控制弹板，点击发射泡泡球，打碎所有砖块过关！</p>
      <button class="btn" id="ovBtn">开始游戏</button>
    </div>
  </div>
  <div id="hint">左右滑动屏幕（电脑移动鼠标）控制弹板，球碰到弹板左右位置会改变反弹角度。共 3 条命。</div>
  <footer>嘘嘘游戏 · 合集</footer>
</div>
<script src="../../js/photos.js"></script>
<script>
(function(){
"use strict";
var COLS=8, BRICK_ROWS=5;
var COLORS=['#4fc3f7','#36b3e3','#7ed6f2','#5ab8e8','#2f9fc9','#8fd3f4'];

var cv=document.getElementById('cv'), ctx=cv.getContext('2d');
var stage=document.getElementById('stage');
var scoreEl=document.getElementById('score'), bestEl=document.getElementById('best'), levelEl=document.getElementById('level');
var overlay=document.getElementById('overlay'), ovTitle=document.getElementById('ovTitle'), ovText=document.getElementById('ovText');

var W=0,H=0,dpr=1;
var bricks=[], ball, paddle, score=0, lives=3, level=1, running=false, stuck=true, rafId=null;
var best=+(localStorage.getItem('xuxu_breakout_best')||0);
bestEl.textContent=best;

function resize(){
  dpr=Math.min(window.devicePixelRatio||1,2);
  var oldW=W;
  W=stage.clientWidth;
  if(!(W>0))return;
  H=Math.round(W*1.1);
  /* 局中转屏/拖窗口：砖块还按旧像素坐标排，会错位甚至超出墙外。
     按宽度比缩放砖块位置和尺寸，保住本局进度 */
  if(oldW>0 && bricks.length && Math.abs(W-oldW)>2){
    var ratio=W/oldW;
    bricks.forEach(function(b){ b.x*=ratio; b.w*=ratio; });
    if(ball){ ball.x*=ratio; }
  }
  cv.width=W*dpr; cv.height=H*dpr;
  cv.style.height=H+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
  buildPaddle();
  draw();
}
window.addEventListener('resize',resize);

function buildPaddle(){
  if(!paddle)paddle={w:W*0.22,h:10,x:W/2-W*0.11,y:H-24};
  else{paddle.w=W*0.22;paddle.y=H-24;paddle.x=Math.min(Math.max(paddle.x,0),W-paddle.w);}
}

function buildBricks(){
  bricks=[];
  var rows=Math.min(BRICK_ROWS+level-1,7);
  /* 砖高 18→22：原来脸区高仅 12px，照片糊成色条（同俄罗斯方块的 MIN_FACE 原则）。
     加高后脸区 16px 起步，轮廓能看了；球场空间仍绰绰有余 */
  var bw=(W-10)/COLS, bh=22;
  for(var r=0;r<rows;r++)for(var c=0;c<COLS;c++){
    if(level>1&&Math.random()<0.12)continue; // 高关卡随机缺块
    bricks.push({x:5+c*bw,y:50+r*(bh+4),w:bw-4,h:bh,k:r%COLORS.length,alive:true});
  }
}

function resetBall(){
  ball={x:W/2,y:paddle.y-12,r:7,vx:0,vy:0};
  stuck=true;
}

function launch(){
  if(!stuck)return;
  stuck=false;
  var sp=4.2+level*0.4;
  var a=(Math.random()*0.6-0.3)-Math.PI/2;
  ball.vx=Math.cos(a)*sp;
  ball.vy=Math.sin(a)*sp;
}

function init(){
  score=0; lives=3; level=1;
  scoreEl.textContent=0; levelEl.textContent=1;
  overlay.classList.remove('show');
  buildPaddle(); buildBricks(); resetBall();
  running=true;
  if(!rafId)rafId=requestAnimationFrame(loop);
}

function end(win){
  running=false;
  if(score>best){best=score;localStorage.setItem('xuxu_breakout_best',best);bestEl.textContent=best;}
  ovTitle.textContent=win?'通关啦！🎉':'游戏结束';
  ovText.textContent='得分 '+score+' · 最佳 '+best;
  overlay.classList.add('show');
}

function loop(){
  rafId=requestAnimationFrame(loop);
  if(!running){draw();return;}
  if(!stuck){
    ball.x+=ball.vx; ball.y+=ball.vy;
    // 墙壁
    if(ball.x<ball.r){ball.x=ball.r;ball.vx=-ball.vx;}
    if(ball.x>W-ball.r){ball.x=W-ball.r;ball.vx=-ball.vx;}
    if(ball.y<ball.r){ball.y=ball.r;ball.vy=-ball.vy;}
    // 掉落
    if(ball.y>H+20){
      lives--;
      if(lives<=0){end(false);return;}
      resetBall();
    }
    // 弹板
    if(ball.vy>0&&ball.y+ball.r>=paddle.y&&ball.y+ball.r<=paddle.y+paddle.h+8&&
       ball.x>=paddle.x-ball.r&&ball.x<=paddle.x+paddle.w+ball.r){
      var hit=(ball.x-(paddle.x+paddle.w/2))/(paddle.w/2); // -1..1
      var sp=Math.sqrt(ball.vx*ball.vx+ball.vy*ball.vy);
      var a=-Math.PI/2+hit*1.0; // 最大偏 57°
      ball.vx=Math.cos(a)*sp;
      ball.vy=Math.sin(a)*sp;
      ball.y=paddle.y-ball.r-0.1;
    }
    // 砖块
    for(var i=0;i<bricks.length;i++){
      var b=bricks[i];
      if(!b.alive)continue;
      if(ball.x>b.x-ball.r&&ball.x<b.x+b.w+ball.r&&ball.y>b.y-ball.r&&ball.y<b.y+b.h+ball.r){
        b.alive=false;
        score+=10;
        scoreEl.textContent=score;
        // 简单反弹：比较重叠方向
        var ox=Math.min(ball.x-(b.x-ball.r),(b.x+b.w+ball.r)-ball.x);
        var oy=Math.min(ball.y-(b.y-ball.r),(b.y+b.h+ball.r)-ball.y);
        if(ox<oy)ball.vx=-ball.vx; else ball.vy=-ball.vy;
        break;
      }
    }
    // 过关
    if(bricks.every(function(b){return !b.alive;})){
      level++;
      levelEl.textContent=level;
      score+=50;
      scoreEl.textContent=score;
      buildBricks(); resetBall();
    }
  }else{
    ball.x=paddle.x+paddle.w/2;
    ball.y=paddle.y-ball.r-2;
  }
  draw();
}

function draw(){
  if(!paddle||!ball)return;   // 页面未布局完成（宽为 0）时还没有可画的对象
  ctx.clearRect(0,0,W,H);
  // 砖块
  bricks.forEach(function(b){
    if(!b.alive)return;
    ctx.fillStyle=COLORS[b.k];
    ctx.beginPath();
    var rad=4;
    ctx.moveTo(b.x+rad,b.y);
    ctx.arcTo(b.x+b.w,b.y,b.x+b.w,b.y+b.h,rad);
    ctx.arcTo(b.x+b.w,b.y+b.h,b.x,b.y+b.h,rad);
    ctx.arcTo(b.x,b.y+b.h,b.x,b.y,rad);
    ctx.arcTo(b.x,b.y,b.x+b.w,b.y,rad);
    ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.3)';
    ctx.fillRect(b.x+3,b.y+2,b.w-6,4);
    // 脸贴砖块内部，四周留原色边框（弹板/小球/❤️生命保持原样）
    if(window.XUXU){
      var inset=3, fw=b.w-inset*2, fh=b.h-inset*2;
      // 脸区小于 14px 就不贴脸：糊成色块反而看不清砖块边界
      if(fw>=14&&fh>=14) XUXU.drawFaceRound(ctx,b.x+inset,b.y+inset,fw,fh,b.k,4);
    }
  });
  // 弹板
  ctx.fillStyle='#238ab3';
  ctx.beginPath();
  var p=paddle, rad=p.h/2;
  ctx.moveTo(p.x+rad,p.y);
  ctx.arcTo(p.x+p.w,p.y,p.x+p.w,p.y+p.h,rad);
  ctx.arcTo(p.x+p.w,p.y+p.h,p.x,p.y+p.h,rad);
  ctx.arcTo(p.x,p.y+p.h,p.x,p.y,rad);
  ctx.arcTo(p.x,p.y,p.x+p.w,p.y,rad);
  ctx.fill();
  // 球
  ctx.beginPath();
  ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);
  ctx.fillStyle='#fff';
  ctx.fill();
  ctx.strokeStyle='#36b3e3';ctx.lineWidth=2;ctx.stroke();
  // 命
  ctx.fillStyle='rgba(255,255,255,.85)';
  ctx.font='13px sans-serif';
  ctx.textAlign='left';
  ctx.fillText('❤️'.repeat(lives),10,H-8);
}

// 输入
function setPaddle(clientX){
  if(!paddle)return;
  var rect=cv.getBoundingClientRect();
  var x=(clientX-rect.left)*(W/rect.width);
  paddle.x=Math.min(Math.max(x-paddle.w/2,0),W-paddle.w);
}
cv.addEventListener('pointermove',function(e){e.preventDefault();setPaddle(e.clientX);});
cv.addEventListener('pointerdown',function(e){
  e.preventDefault();
  setPaddle(e.clientX);
  if(running&&stuck)launch();
});
window.addEventListener('keydown',function(e){
  if(!paddle)return;   // 页面还没布局完成（宽为 0）时弹板不存在
  if(e.key==='ArrowLeft'){paddle.x=Math.max(paddle.x-24,0);}
  else if(e.key==='ArrowRight'){paddle.x=Math.min(paddle.x+24,W-paddle.w);}
  else if(e.key===' '&&running&&stuck){launch();e.preventDefault();}
});
document.getElementById('restart').addEventListener('click',init);
document.getElementById('ovBtn').addEventListener('click',init);

resize();
ball={x:0,y:0,r:7};
resetBall();
if(!rafId)rafId=requestAnimationFrame(loop);
// 主循环每帧都会重画，照片加载好后自然出现
if(window.XUXU){ XUXU.preload(function(){}); }
})();
</script>
</body>
</html>
