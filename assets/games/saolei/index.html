<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>嘘嘘扫雷</title>
<style>
:root{
  --bg:#e9f6fc; --ink:#2c4a5a; --accent:#36b3e3; --accent-dark:#238ab3;
  --bubble:#cdeaf7; --radius:14px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  background:linear-gradient(180deg,#d8f0fb 0%,var(--bg) 40%,#f4fbff 100%);
  min-height:100vh;color:var(--ink);
}
.wrap{max-width:480px;margin:0 auto;padding:16px 14px 40px}
header{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.back{
  width:38px;height:38px;border:none;border-radius:50%;background:#fff;color:var(--accent-dark);
  font-size:18px;cursor:pointer;box-shadow:0 2px 8px rgba(44,116,150,.15);flex-shrink:0;
}
h1{font-size:22px;font-weight:800;letter-spacing:1px}
h1 span{color:var(--accent-dark)}
.toolbar{display:flex;gap:8px;margin-bottom:12px;align-items:center}
.stat{
  flex:1;background:#fff;border-radius:var(--radius);padding:8px 10px;
  box-shadow:0 2px 10px rgba(44,116,150,.1);text-align:center;
}
.stat .label{font-size:11px;color:#7ba3b5}
.stat .val{font-size:20px;font-weight:800;color:var(--accent-dark)}
button.btn{
  border:none;border-radius:var(--radius);background:var(--accent);color:#fff;
  font-size:14px;font-weight:700;padding:9px 14px;cursor:pointer;
  box-shadow:0 3px 10px rgba(54,179,227,.35);
}
button.btn:active{background:var(--accent-dark)}
button.btn.ghost{background:#fff;color:var(--accent-dark);box-shadow:0 2px 8px rgba(44,116,150,.15)}
button.btn.ghost.active{background:var(--accent-dark);color:#fff}
#stage{
  position:relative;width:100%;
  background:#a8cce0;border-radius:18px;
  box-shadow:0 6px 20px rgba(44,116,150,.22);
  padding:6px;
}
#grid{display:grid;gap:2px}
.cellbox{
  aspect-ratio:1/1;border:none;border-radius:5px;cursor:pointer;
  background:#fff;font-family:inherit;font-weight:800;
  display:flex;align-items:center;justify-content:center;
  font-size:clamp(10px,3.2vw,18px);
  transition:background .1s;
}
.cellbox:not(.open):active{background:var(--bubble)}
.cellbox.open{background:rgba(255,255,255,.45);cursor:default}
.cellbox.flag{background:var(--bubble)}
.cellbox.boom{background:#ff8f8f}
/* 嘘嘘脸只贴在“未揭开”的格子表面；一旦揭开或插旗，背景图彻底消失，数字/雷/旗不受影响 */
.cellbox.open,.cellbox.flag{background-image:none !important}
.cellbox:not(.open):active{filter:brightness(.86)} /* 脸会盖住按下的底色，改用变暗保留手感反馈 */
.cellbox[data-n="1"]{color:#36b3e3}.cellbox[data-n="2"]{color:#2fa66a}
.cellbox[data-n="3"]{color:#f08c3a}.cellbox[data-n="4"]{color:#8a6fd6}
.cellbox[data-n="5"]{color:#e05e7a}.cellbox[data-n="6"]{color:#25a5a5}
.cellbox[data-n="7"]{color:#6b7b8c}.cellbox[data-n="8"]{color:#4a5a6a}
#overlay{
  position:absolute;inset:0;background:rgba(233,246,252,.94);border-radius:18px;
  display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;
}
#overlay.show{display:flex}
#overlay h2{font-size:26px;font-weight:900}
#overlay p{font-size:15px;color:#5b8296}
#hint{text-align:center;font-size:13px;color:#7ba3b5;margin-top:12px;line-height:1.7}
footer{margin-top:26px;text-align:center;font-size:12px;color:#9dbccb}
@media (min-width:600px){
  h1{font-size:26px}
}
@media (min-width:1024px){
  .wrap{max-width:560px;padding-top:40px}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <button class="back" onclick="location.href='../../index.html'" title="返回大厅">←</button>
    <h1>嘘嘘<span>扫雷</span></h1>
  </header>
  <div class="toolbar">
    <div class="stat"><div class="label">剩余雷数</div><div class="val" id="mines">10</div></div>
    <div class="stat"><div class="label">用时(秒)</div><div class="val" id="time">0</div></div>
    <button class="btn ghost" id="flagMode">🚩 插旗</button>
    <button class="btn" id="restart">新开局</button>
  </div>
  <div id="stage">
    <div id="grid"></div>
    <div id="overlay">
      <h2 id="ovTitle"></h2>
      <p id="ovText"></p>
      <button class="btn" id="ovBtn">再来一局</button>
    </div>
  </div>
  <div id="hint">点击翻开格子，数字表示周围 8 格的地雷数；切到插旗模式（或电脑右键）标记地雷。翻开所有非雷格子即胜利！首次点击保证安全。</div>
  <footer>嘘嘘游戏 · 合集</footer>
</div>
<script src="../../js/photos.js"></script>
<script>
(function(){
"use strict";
var LEVEL={cols:9,rows:9,mines:10}; // 入门 9x9，手机友好
var gridEl=document.getElementById('grid');
var minesEl=document.getElementById('mines'), timeEl=document.getElementById('time');
var overlay=document.getElementById('overlay'), ovTitle=document.getElementById('ovTitle'), ovText=document.getElementById('ovText');
var flagBtn=document.getElementById('flagMode');

var cols,rows,totalMines,board,cells,opened,flags,started,over,flagMode=false,timer=null,secs=0;

function idx(r,c){return r*cols+c;}
function neighbors(i){
  var r=Math.floor(i/cols), c=i%cols, out=[];
  for(var dr=-1;dr<=1;dr++)for(var dc=-1;dc<=1;dc++){
    if(!dr&&!dc)continue;
    var rr=r+dr, cc=c+dc;
    if(rr>=0&&rr<rows&&cc>=0&&cc<cols)out.push(idx(rr,cc));
  }
  return out;
}

function init(){
  cols=LEVEL.cols; rows=LEVEL.rows; totalMines=LEVEL.mines;
  board=new Array(cols*rows).fill(0);
  opened=new Array(cols*rows).fill(false);
  flags=new Array(cols*rows).fill(false);
  started=false; over=false; secs=0; flagMode=false;
  flagBtn.classList.remove('active');
  minesEl.textContent=totalMines; timeEl.textContent=0;
  clearInterval(timer);
  overlay.classList.remove('show');
  gridEl.style.gridTemplateColumns='repeat('+cols+',1fr)';
  gridEl.innerHTML='';
  cells=[];
  for(var i=0;i<cols*rows;i++){
    var b=document.createElement('button');
    b.className='cellbox';
    if(window.XUXU&&XUXU.COUNT)XUXU.setFace(b,i%XUXU.COUNT);  // 按格子位置发脸，11 张循环，和雷的分布无关
    (function(i){
      b.addEventListener('click',function(){clickCell(i);});
      b.addEventListener('contextmenu',function(e){e.preventDefault();toggleFlag(i);});
    })(i);
    gridEl.appendChild(b);
    cells.push(b);
  }
}

function plantMines(safe){
  var pool=[];
  for(var i=0;i<cols*rows;i++)if(i!==safe&&!neighbors(safe).includes(i))pool.push(i);
  for(var m=0;m<totalMines;m++){
    var j=Math.floor(Math.random()*pool.length);
    board[pool[j]]=-1;
    pool.splice(j,1);
  }
  for(i=0;i<cols*rows;i++){
    if(board[i]===-1)continue;
    var n=0;
    neighbors(i).forEach(function(nb){if(board[nb]===-1)n++;});
    board[i]=n;
  }
}

function startTimer(){
  if(started)return;
  started=true;
  timer=setInterval(function(){secs++;timeEl.textContent=secs;},1000);
}

function toggleFlag(i){
  if(over||opened[i])return;
  flags[i]=!flags[i];
  cells[i].classList.toggle('flag',flags[i]);
  cells[i].textContent=flags[i]?'🚩':'';
  var left=totalMines-flags.filter(Boolean).length;
  minesEl.textContent=left;
}

function clickCell(i){
  if(over||flags[i])return;
  if(flagMode){toggleFlag(i);return;}
  if(!started)plantMines(i);
  startTimer();
  if(board[i]===-1){reveal(i);return;}
  // flood fill
  var stack=[i];
  while(stack.length){
    var cur=stack.pop();
    if(opened[cur]||flags[cur])continue;
    opened[cur]=true;
    var b=cells[cur];
    b.classList.add('open');
    if(board[cur]>0){b.textContent=board[cur];b.setAttribute('data-n',board[cur]);}
    else neighbors(cur).forEach(function(nb){if(!opened[nb])stack.push(nb);});
  }
  checkWin();
}

function reveal(i){
  over=true;
  clearInterval(timer);
  for(var j=0;j<cols*rows;j++){
    if(board[j]===-1){
      cells[j].classList.add('open');
      cells[j].textContent='💣';
      if(j===i)cells[j].classList.add('boom');
    }
  }
  ovTitle.textContent='踩到雷啦 💥';
  ovText.textContent='坚持了 '+secs+' 秒，再来一局吧！';
  overlay.classList.add('show');
}

function checkWin(){
  var openCount=opened.filter(Boolean).length;
  if(openCount===cols*rows-totalMines){
    over=true;
    clearInterval(timer);
    for(var j=0;j<cols*rows;j++)if(board[j]===-1){cells[j].textContent='🚩';cells[j].classList.add('flag');}
    ovTitle.textContent='胜利啦！🎉';
    ovText.textContent='用时 '+secs+' 秒扫清全部地雷！';
    overlay.classList.add('show');
  }
}

flagBtn.addEventListener('click',function(){
  flagMode=!flagMode;
  flagBtn.classList.toggle('active',flagMode);
});
document.getElementById('restart').addEventListener('click',init);
document.getElementById('ovBtn').addEventListener('click',init);

init();
})();
</script>
</body>
</html>
