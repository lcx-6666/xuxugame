<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>嘘嘘五子棋</title>
<style>
  :root{
    --bg:#e9f6fc;
    --ink:#2c4a5a;
    --ink-soft:#5d7d8d;
    --accent:#36b3e3;
    --accent-dark:#238ab3;
    --bubble:#cdeaf7;
    --board:#f0c98f;
    --grid:#cfa163;
    --radius:14px;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    background:var(--bg);
    background-image:
      radial-gradient(circle at 14% 10%, rgba(54,179,227,.18), transparent 42%),
      radial-gradient(circle at 86% 88%, rgba(120,210,240,.18), transparent 45%),
      radial-gradient(circle at 72% 12%, rgba(180,230,250,.20), transparent 38%);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",-apple-system,sans-serif;
    color:var(--ink);
    min-height:100%;
    padding:18px 0 30px;
    user-select:none;-webkit-user-select:none;
    touch-action:manipulation;
  }
  .wrap{max-width:600px;margin:0 auto;padding:0 14px;}
  header{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;flex-wrap:wrap;}
  .logo{display:flex;align-items:center;gap:8px;}
  .logo .bubble{font-size:38px;line-height:1;filter:drop-shadow(0 2px 0 rgba(0,0,0,.08));animation:bob 2.4s ease-in-out infinite;}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-5px) rotate(3deg)}}
  h1{font-size:30px;letter-spacing:2px;font-weight:800;}
  h1 small{display:block;font-size:12px;font-weight:600;color:var(--ink-soft);letter-spacing:3px;margin-top:2px;}
  .status{font-size:14px;font-weight:700;color:var(--ink-soft);background:#fff;border:2px solid var(--bubble);border-radius:12px;padding:6px 14px;}
  .toolbar{display:flex;gap:8px;margin:14px 0 12px;flex-wrap:wrap;}
  button.btn{
    flex:1;min-width:88px;border:none;border-radius:999px;padding:10px 12px;font-size:15px;font-weight:700;
    cursor:pointer;font-family:inherit;letter-spacing:1px;
    background:#fff;color:var(--ink);border:2px solid var(--bubble);box-shadow:0 3px 0 #b3dcee;
    transition:transform .08s ease, box-shadow .08s ease;
  }
  button.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #b3dcee;}
  button.btn.primary{background:var(--accent);border-color:var(--accent-dark);color:#fff;box-shadow:0 3px 0 #1f7aa0;}
  button.btn.primary:active{box-shadow:0 1px 0 #1f7aa0;}
  .tip{font-size:12px;color:var(--ink-soft);margin-bottom:10px;line-height:1.7;}
  .tip b{color:var(--accent-dark);}
  #boardWrap{position:relative;width:100%;max-width:560px;margin:0 auto;background:var(--board);border-radius:calc(var(--radius) + 6px);box-shadow:0 6px 0 rgba(35,90,115,.12), inset 0 2px 6px rgba(255,255,255,.4);overflow:hidden;}
  #gameCanvas{display:block;width:100%;}
  #overlay{
    position:absolute;inset:0;border-radius:calc(var(--radius) + 6px);
    background:rgba(233,246,252,.92);backdrop-filter:blur(3px);
    display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;
    text-align:center;z-index:5;
  }
  #overlay.show{display:flex;animation:fadein .3s ease;}
  @keyframes fadein{from{opacity:0}}
  #overlay .big{font-size:50px;}
  #overlay .msg{font-size:22px;font-weight:800;letter-spacing:2px;}
  #overlay .sub{font-size:13px;color:var(--ink-soft);}
  #overlay .row{display:flex;gap:10px;}
  #overlay button.btn{flex:none;padding:10px 22px;}
  footer{margin-top:16px;padding:0 14px;font-size:11px;color:var(--ink-soft);text-align:center;line-height:1.8;}
  footer a{color:var(--accent-dark);text-decoration:none;}

  @media (min-width: 600px) {
    body{padding:32px 0 40px;}
    .wrap{max-width:640px;padding:0 20px;}
    h1{font-size:36px;} h1 small{font-size:14px;}
    .logo .bubble{font-size:46px;}
    button.btn{padding:12px 18px;font-size:16px;}
    .tip{font-size:13px;}
    footer{font-size:12px;margin-top:22px;}
  }
  @media (min-width: 1024px) {
    body{padding:48px 0 60px;}
    .wrap{max-width:720px;}
    h1{font-size:42px;}
    .logo .bubble{font-size:54px;}
    button.btn{padding:14px 22px;font-size:17px;}
    .tip{font-size:14px;}
    footer{font-size:13px;}
  }
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="logo">
    <span class="bubble">⚫</span>
    <h1>嘘嘘五子棋<small>人机对战</small></h1>
  </div>
  <div class="status" id="status">黑棋 · 该你了</div>
</header>

<div class="toolbar">
  <button class="btn primary" id="btnNew">⚫ 新开局</button>
  <button class="btn" id="btnUndo">↩️ 悔棋</button>
  <button class="btn" id="btnBack">🏠 大厅</button>
</div>

<div class="tip" id="tip">你是黑棋，点击棋盘交叉点落子。率先连成五子获胜！</div>

<div id="boardWrap">
  <canvas id="gameCanvas"></canvas>
  <div id="overlay">
    <div class="big" id="ovEmoji">🏆</div>
    <div class="msg" id="ovMsg"></div>
    <div class="sub" id="ovSub"></div>
    <div class="row">
      <button class="btn primary" id="ovBtn1">⚫ 再来一局</button>
      <button class="btn" id="ovBtn2">🏠 返回大厅</button>
    </div>
  </div>
</div>
</div>

<footer>
  点击棋盘落子 · <a href="../../../index.html">🏠 返回嘘嘘游戏大厅</a><br>
  灵感来自 <a href="https://milkyfrog.com/games" target="_blank" rel="noopener">milkyfrog.com</a> 奶蛙游戏宇宙
</footer>

<script src="../../js/photos.js"></script>
<script>
(function(){
"use strict";
var N=15;
var canvas=document.getElementById('gameCanvas');
var ctx=canvas.getContext('2d');
var wrap=document.getElementById('boardWrap');
var statusEl=document.getElementById('status');
var tipEl=document.getElementById('tip');

var W, CELL, PAD, R;
var board=[]; // 0 empty, 1 black(human), 2 white(AI)
var history=[];
var current=1; // black first
var over=false, locked=false;
var gen=0; // 局数代记号：AI 延迟落子若来自上一局，直接丢弃

function resize(){
  var rect=wrap.getBoundingClientRect();
  W=Math.floor(rect.width);
  /* 以前画布没按 dpr 放大，手机（dpr 2~3）上棋子/棋盘线全是虚的 */
  var dpr=Math.min(window.devicePixelRatio||1,2);
  canvas.width=W*dpr; canvas.height=W*dpr;
  canvas.style.height=W+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
  CELL=W/(N+1);
  PAD=CELL;
  R=CELL*0.38;
}

function init(){
  gen++;
  board=[]; for(var i=0;i<N;i++){var row=[];for(var j=0;j<N;j++)row.push(0);board.push(row);}
  history=[]; current=1; over=false; locked=false;
  hideOverlay();
  statusEl.textContent='黑棋 · 该你了';
  tipEl.textContent='你是黑棋，点击棋盘交叉点落子。率先连成五子获胜！';
  draw();
}

function draw(){
  ctx.clearRect(0,0,W,W);
  // board bg
  ctx.fillStyle='#f0c98f'; ctx.fillRect(0,0,W,W);
  // grid
  ctx.strokeStyle='#cfa163'; ctx.lineWidth=1;
  for(var i=0;i<N;i++){
    var p=PAD+i*CELL;
    ctx.beginPath(); ctx.moveTo(PAD,p); ctx.lineTo(W-PAD,p); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(p,PAD); ctx.lineTo(p,W-PAD); ctx.stroke();
  }
  // star points
  var stars=[3,7,11];
  ctx.fillStyle='#b08040';
  stars.forEach(function(r){
    stars.forEach(function(c){
      ctx.beginPath(); ctx.arc(PAD+c*CELL,PAD+r*CELL,CELL*0.12,0,Math.PI*2); ctx.fill();
    });
  });
  // stones
  for(var r=0;r<N;r++)for(var c=0;c<N;c++){
    if(board[r][c]===0)continue;
    var x=PAD+c*CELL, y=PAD+r*CELL;
    ctx.beginPath(); ctx.arc(x,y,R,0,Math.PI*2);
    var grad=ctx.createRadialGradient(x-R*0.3,y-R*0.3,R*0.1,x,y,R);
    if(board[r][c]===1){
      grad.addColorStop(0,'#555'); grad.addColorStop(0.3,'#222'); grad.addColorStop(1,'#000');
    }else{
      grad.addColorStop(0,'#fff'); grad.addColorStop(0.3,'#eee'); grad.addColorStop(1,'#ccc');
    }
    ctx.fillStyle=grad; ctx.fill();
    ctx.strokeStyle='rgba(0,0,0,.15)'; ctx.lineWidth=1; ctx.stroke();
    /* 把棋子画成嘘嘘的脸。
       原来脸占 R*0.68，把黑白本体挤得只剩外圈 32%，实测白子对棋盘底色只差 25 个亮度单位，
       白子容易看丢。这里做两件事：
       1) 脸缩到 R*0.52，让黑/白渐变重新成为主要面积；
       2) 两种棋子都补一圈深色外轮廓，保证在米黄棋盘上边缘清晰。
       照片没加载好就完全走原来的黑白渐变子，不描额外轮廓。 */
    if(window.XUXU){
      var pi=(r*N+c)%XUXU.COUNT;
      var fr=R*0.52;
      var isBlack=board[r][c]===1;
      var ring=isBlack?'rgba(255,255,255,.95)':'rgba(0,0,0,.5)';
      if(XUXU.drawFace(ctx,x,y,fr,pi,{ring:ring,ringWidth:0.12})){
        /* 细描边：只用来把棋子边界从米黄棋盘上勾出来。
           描边太粗会让白子边缘发暗，反而把黑白差距从 153 压到 85，所以用细的。
           实测：脸 0.68→0.52 使黑白本体亮度差 66→203，白子本体对棋盘 4→47。 */
        var rw=Math.max(1,R*0.1);
        ctx.beginPath(); ctx.arc(x,y,R-rw/2,0,Math.PI*2);
        ctx.lineWidth=rw;
        ctx.strokeStyle=isBlack?'rgba(0,0,0,.8)':'rgba(0,0,0,.45)';
        ctx.stroke();
      }
    }
  }
  // last move marker
  if(history.length){
    var last=history[history.length-1];
    var lx=PAD+last.c*CELL, ly=PAD+last.r*CELL;
    ctx.beginPath(); ctx.arc(lx,ly,CELL*0.12,0,Math.PI*2);
    ctx.fillStyle=board[last.r][last.c]===1?'#ff5a5a':'#ff5a5a'; ctx.fill();
  }
}

function place(r,c){
  if(over||locked||r<0||r>=N||c<0||c>=N||board[r][c]!==0)return false;
  board[r][c]=current;
  history.push({r:r,c:c,player:current});
  if(checkWin(r,c,current)){
    over=true; draw(); showOverlay(current===1?'你赢了！':'AI 赢了'); return true;
  }
  if(history.length>=N*N){
    over=true; draw(); showOverlay('平局！'); return true;
  }
  current=3-current;
  statusEl.textContent=current===1?'黑棋 · 该你了':'白棋 · AI 思考中…';
  draw();
  return true;
}

function onClick(e){
  if(over||locked||current!==1)return;
  var rect=canvas.getBoundingClientRect();
  var clientX=e.touches?e.touches[0].clientX:e.clientX;
  var clientY=e.touches?e.touches[0].clientY:e.clientY;
  var x=(clientX-rect.left)*(W/rect.width)-PAD;
  var y=(clientY-rect.top)*(W/rect.height)-PAD;
  var c=Math.round(x/CELL);
  var r=Math.round(y/CELL);
  if(c<0||c>=N||r<0||r>=N)return;
  if(place(r,c)){
    if(!over){
      locked=true;
      var g=gen;
      /* AI 400ms 后才落子；这期间若点了新开局/悔棋，迟到的白子会落进新棋盘 */
      setTimeout(function(){ if(g===gen) aiMove(); },400);
    }
  }
}

function aiMove(){
  if(over){locked=false;return;}
  var move=findBestMove();
  if(move){
    place(move.r,move.c);
  }
  locked=false;
}

function findBestMove(){
  // 1. AI win
  var win=findThreat(2,5,true);
  if(win)return win;
  // 2. block player win
  var block=findThreat(1,5,true);
  if(block)return block;
  // 3. create open 4
  var open4=findThreat(2,4,false);
  if(open4)return open4;
  // 4. block open 4
  var blockOpen4=findThreat(1,4,false);
  if(blockOpen4)return blockOpen4;
  // 5. create/best score
  var best=null, bestScore=-1;
  for(var r=0;r<N;r++)for(var c=0;c<N;c++){
    if(board[r][c]!==0)continue;
    var s=cellScore(r,c,2)+cellScore(r,c,1)*0.8;
    if(s>bestScore){bestScore=s; best={r:r,c:c};}
  }
  return best;
}

function findThreat(player,len,exact){
  var dirs=[[0,1],[1,0],[1,1],[1,-1]];
  for(var r=0;r<N;r++)for(var c=0;c<N;c++){
    if(board[r][c]!==0)continue;
    for(var d=0;d<4;d++){
      var dr=dirs[d][0], dc=dirs[d][1];
      var count=1, emptyEnds=0;
      // forward
      var rr=r+dr, cc=c+dc, gap=0;
      while(rr>=0&&rr<N&&cc>=0&&cc<N){
        if(board[rr][cc]===player){count++; rr+=dr; cc+=dc;}
        else if(board[rr][cc]===0){emptyEnds++; break;}
        else break;
      }
      // backward
      rr=r-dr; cc=c-dc;
      while(rr>=0&&rr<N&&cc>=0&&cc<N){
        if(board[rr][cc]===player){count++; rr-=dr; cc-=dc;}
        else if(board[rr][cc]===0){emptyEnds++; break;}
        else break;
      }
      if(exact && count===len && emptyEnds>=1) return {r:r,c:c};
      if(!exact && count===len && emptyEnds===2) return {r:r,c:c};
    }
  }
  return null;
}

function cellScore(r,c,player){
  var dirs=[[0,1],[1,0],[1,1],[1,-1]];
  var total=0;
  for(var d=0;d<4;d++){
    var dr=dirs[d][0], dc=dirs[d][1];
    var count=1, empty=0, blocked=0;
    var rr=r+dr, cc=c+dc;
    while(rr>=0&&rr<N&&cc>=0&&cc<N){
      if(board[rr][cc]===player)count++;
      else if(board[rr][cc]===0){empty++; break;}
      else{blocked++; break;}
      rr+=dr; cc+=dc;
    }
    rr=r-dr; cc=c-dc;
    while(rr>=0&&rr<N&&cc>=0&&cc<N){
      if(board[rr][cc]===player)count++;
      else if(board[rr][cc]===0){empty++; break;}
      else{blocked++; break;}
      rr-=dr; cc-=dc;
    }
    var score=Math.pow(10,count);
    if(empty===2) score*=2;
    if(blocked) score*=0.3;
    total+=score;
  }
  return total;
}

function checkWin(r,c,player){
  var dirs=[[0,1],[1,0],[1,1],[1,-1]];
  for(var d=0;d<4;d++){
    var dr=dirs[d][0], dc=dirs[d][1];
    var count=1;
    var rr=r+dr, cc=c+dc;
    while(rr>=0&&rr<N&&cc>=0&&cc<N&&board[rr][cc]===player){count++;rr+=dr;cc+=dc;}
    rr=r-dr; cc=c-dc;
    while(rr>=0&&rr<N&&cc>=0&&cc<N&&board[rr][cc]===player){count++;rr-=dr;cc-=dc;}
    if(count>=5)return true;
  }
  return false;
}

function undo(){
  if(history.length===0||locked)return;
  // undo AI + player last pair
  var steps=history.length%2===0?2:1;
  for(var i=0;i<steps;i++){
    var m=history.pop();
    if(m)board[m.r][m.c]=0;
  }
  current=1; over=false;
  statusEl.textContent='黑棋 · 该你了';
  hideOverlay();
  draw();
}

function showOverlay(msg){
  document.getElementById('ovEmoji').textContent=msg.indexOf('你')>=0?'🏆':'🤖';
  document.getElementById('ovMsg').textContent=msg;
  document.getElementById('ovSub').textContent='五子连珠，功德圆满';
  document.getElementById('overlay').classList.add('show');
}
function hideOverlay(){document.getElementById('overlay').classList.remove('show');}

canvas.addEventListener('mousedown',onClick);
canvas.addEventListener('touchstart',onClick,{passive:false});

document.getElementById('btnNew').onclick=init;
document.getElementById('btnUndo').onclick=undo;
document.getElementById('btnBack').onclick=function(){location.href='../../../index.html';};
document.getElementById('ovBtn1').onclick=init;
document.getElementById('ovBtn2').onclick=function(){location.href='../../../index.html';};

resize(); init();
// 静态重画型游戏：照片加载好一张就主动重画一次，否则脸永远不出现
if(window.XUXU){ XUXU.preload(function(){ draw(); }); }
window.addEventListener('resize',function(){resize(); draw();});
})();
</script>
</body>
</html>
